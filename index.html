<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ControlMaq - Gestão de Manutenção</title>

    <!-- Ficheiro de Manifesto PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Cores de tema e barra de estado -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ControlMaq" />

    <!-- Ícones da aplicação -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Registo automático do Service Worker para suporte PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then(() => {
              console.log('[PWA] Service Worker registado com sucesso.');
            })
            .catch((erro) => {
              console.error('[PWA] Erro ao registar Service Worker:', erro);
            });
        });
      }
    </script>

    <!-- Ponto de entrada da aplicação React -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
